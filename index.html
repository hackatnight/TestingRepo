<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Web Studio / Probe</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 20px;
      background: #f7f9fa;
      color: #333;
    }
    h1 { font-size: 1.4rem; }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }
    button:hover { background: #eee; }
    #status {
      font-weight: bold;
      margin-bottom: 10px;
    }
    #log {
      width: 100%;
      height: 400px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: Consolas, monospace;
      font-size: 12px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 4px;
      overflow-y: scroll;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>HT37 Watch Web Probe</h1>
  <div class="controls">
    <button id="btnConnect">Scan & Connect</button>
    <button id="btnDisconnect" disabled>Disconnect</button>
    <button id="btnClear">Clear Log</button>
  </div>
  <div id="status">Status: Disconnected</div>
  <pre id="log"></pre>

  <script src="app.js"></script>
</body>
</html>
