<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Studio [Build 6.0]</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 15px; }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .workspace {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1050px;
    }
    .watch-bezel {
      width: 380px;
      height: 380px;
      background: #020617;
      border: 8px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8);
    }
    #watchCanvas {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #000;
    }
    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: #94a3b8; }
    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    input[type="color"] { height: 38px; padding: 2px; cursor: pointer; }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.btn-primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; cursor: pointer; }
    button.btn-primary:hover { background: #0369a1; }
    button.btn-secondary { background: #1e293b; cursor: pointer; }
    button.btn-danger { background: #991b1b; border-color: var(--danger); cursor: pointer; }
    button.btn-success { background: #065f46; border-color: var(--success); cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    #logBox {
      background: #020617;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.72rem;
      padding: 12px;
      border-radius: 8px;
      height: 180px;
      overflow-y: auto;
      margin-top: 15px;
      width: 100%;
      max-width: 800px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>HT37 Watch Face Studio</h1>
    <div class="badge">BUILD 6.0 - HARDWARE PIPE VERIFIED</div>
  </header>

  <div class="workspace">
    <div class="preview-section">
      <div class="watch-bezel">
        <canvas id="watchCanvas" width="360" height="360"></canvas>
      </div>

      <div class="editor-panel" style="margin-top: 15px;">
        <span class="section-title">Hardware Link (00009966)</span>
        <div class="inline-fields">
          <button id="btnConnect" class="btn-primary">1. Connect HT37</button>
          <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
        </div>
        <div class="inline-fields">
          <button id="btnProbeWake" class="btn-success" disabled>⚡ Multi-Wake Probe</button>
          <button id="btnSyncTime" class="btn-secondary" disabled>Sync Clock</button>
        </div>
        
        <span class="section-title" style="margin-top: 5px;">Raw Packet Console</span>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="hexInput" placeholder="e.g. 08 01 01" style="flex: 1;">
          <button id="btnSendHex" class="btn-secondary" disabled>Send</button>
        </div>
      </div>
    </div>

    <div class="editor-panel">
      <span class="section-title">Wallpaper</span>
      <div class="form-group">
        <label>Upload Image (Auto-scaled to 360x360)</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>

      <span class="section-title">Clock Typography</span>
      <div class="inline-fields">
        <div class="form-group">
          <label>Color</label>
          <input type="color" id="timeColor" value="#ffffff">
        </div>
        <div class="form-group">
          <label>Size (px)</label>
          <input type="number" id="timeSize" value="64" min="20" max="120">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label>Position (Y)</label>
          <input type="range" id="timePosY" min="60" max="300" value="160">
        </div>
        <div class="form-group">
          <label>Font</label>
          <select id="timeFont">
            <option value="sans-serif">Modern Sans</option>
            <option value="monospace">Digital Monospace</option>
            <option value="Impact">Bold Impact</option>
          </select>
        </div>
      </div>

      <span class="section-title">Widgets</span>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showDate" checked> Date</label>
          <input type="color" id="dateColor" value="#38bdf8">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showBattery" checked> Battery</label>
          <input type="color" id="batteryColor" value="#4ade80">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showSteps" checked> Steps</label>
          <input type="color" id="stepsColor" value="#facc15">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showHeart" checked> Heart Rate</label>
          <input type="color" id="heartColor" value="#f87171">
        </div>
      </div>
    </div>
  </div>

  <div id="logBox">Status: Build 6.0 Ready. Verified service 00009966 configured. Click "1. Connect HT37".</div>

  <script>
    // Verified HT37 Hardware UUIDs
    const HT37_SERVICE_UUID = '00009966-3c17-d293-8e48-14fe2e4da212';
    const HT37_TX_CHAR      = '0000ffb1-0000-1000-8000-00805f9b34fb'; // Write
    const HT37_RX_CHAR      = '0000ffb2-0000-1000-8000-00805f9b34fb'; // Notify

    let bleDevice = null;
    let charWrite = null;
    let charNotify = null;

    const logBox = document.getElementById('logBox');
    function log(msg) {
      console.log(msg);
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function setButtons(connected) {
      document.getElementById('btnDisconnect').disabled = !connected;
      document.getElementById('btnProbeWake').disabled   = !connected;
      document.getElementById('btnSyncTime').disabled    = !connected;
      document.getElementById('btnSendHex').disabled     = !connected;
    }

    // --- CONNECTION HANDLER ---
    document.getElementById('btnConnect').onclick = async () => {
      try {
        log('Connecting to HT37 via verified pipe 00009966...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { name: 'HT37' },
            { namePrefix: 'HT37' }
          ],
          optionalServices: [HT37_SERVICE_UUID, 0x1800, 0x180a]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          log('Notice: HT37 disconnected.');
          setButtons(false);
          charWrite = null;
          charNotify = null;
        });

        log(`Target chosen: ${bleDevice.name}. Connecting GATT...`);
        const server = await bleDevice.gatt.connect();

        log('Waiting 800ms for Windows GATT initialization...');
        await sleep(800);

        const service = await server.getPrimaryService(HT37_SERVICE_UUID);
        charWrite = await service.getCharacteristic(HT37_TX_CHAR);
        charNotify = await service.getCharacteristic(HT37_RX_CHAR);

        // Start real-time notifications
        await charNotify.startNotifications();
        charNotify.addEventListener('characteristicvaluechanged', (e) => {
          const b = new Uint8Array(e.target.value.buffer);
          log(`RX [${b.length}B]: ${Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ')}`);
        });

        log('SUCCESS: Persistent communication channel active!');
        setButtons(true);

      } catch (err) {
        log('Connection failed: ' + err.message);
        setButtons(false);
      }
    };

    document.getElementById('btnDisconnect').onclick = () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      setButtons(false);
    };

    async function sendPacket(bytes) {
      if (!charWrite) return;
      const data = new Uint8Array(bytes);
      log(`TX [${data.length}B]: ${Array.from(data).map(x => x.toString(16).padStart(2, '0')).join(' ')}`);
      if (charWrite.properties.write) {
        await charWrite.writeValue(data);
      } else {
        await charWrite.writeValueWithoutResponse(data);
      }
    }

    // --- MULTI-WAKE PROBE (Tests Top Candidate Commands) ---
    document.getElementById('btnProbeWake').onclick = async () => {
      if (!charWrite) return;
      log('Starting Multi-Wake Probe (Watch the display and feel for vibration)...');

      // Candidate command frames across Realtek/FitCloud protocols
      const candidates = [
        { name: 'Find Device (Cmd 0x08)',  pkt: [0x08, 0x01, 0x01] },
        { name: 'Find Device (Cmd 0x04)',  pkt: [0x04, 0x01, 0x01] },
        { name: 'Screen On (Cmd 0x0E)',    pkt: [0x0E, 0x01, 0x01] },
        { name: 'Alert Level (High)',      pkt: [0x02, 0x02] },
        { name: 'Find Wristband (0x0B)',   pkt: [0x0B, 0x01] },
        { name: 'Vibrate Notify (0x07)',   pkt: [0x07, 0x01, 0x01, 0x00] }
      ];

      for (const item of candidates) {
        log(`Probing: ${item.name}...`);
        await sendPacket(item.pkt);
        await sleep(500); // Wait for watch response
      }
      log('Multi-Wake Probe complete. Check log for RX notifications.');
    };

    // --- SYNC TIME (Updates Watch Clock) ---
    document.getElementById('btnSyncTime').onclick = async () => {
      const now = new Date();
      const yearHi = (now.getFullYear() >> 8) & 0xFF;
      const yearLo = now.getFullYear() & 0xFF;
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const hour = now.getHours();
      const min = now.getMinutes();
      const sec = now.getSeconds();

      // Standard Realtek Time Sync Packet: Cmd 0x01
      log(`Syncing current time to watch: ${now.toLocaleTimeString()}...`);
      await sendPacket([0x01, yearHi, yearLo, month, day, hour, min, sec]);
    };

    // --- RAW HEX SENDER ---
    document.getElementById('btnSendHex').onclick = async () => {
      const hex = document.getElementById('hexInput').value.trim();
      if (!hex) return;
      const bytes = hex.split(/[\s,]+/).map(b => parseInt(b, 16)).filter(b => !isNaN(b));
      if (bytes.length === 0) {
        log('Error: Invalid hex input.');
        return;
      }
      await sendPacket(bytes);
    };

    // --- CANVAS ENGINE (360x360) ---
    const canvas = document.getElementById('watchCanvas');
    const ctx = canvas.getContext('2d');
    let userBgImage = null;

    function renderPreview() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 360, 360);
      if (userBgImage) ctx.drawImage(userBgImage, 0, 0, 360, 360);

      const timeStr = "10:08";
      const font = document.getElementById('timeFont').value;
      const size = document.getElementById('timeSize').value;
      const posY = parseInt(document.getElementById('timePosY').value);

      ctx.fillStyle = document.getElementById('timeColor').value;
      ctx.font = `bold ${size}px ${font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeStr, 180, posY);

      if (document.getElementById('showDate').checked) {
        ctx.fillStyle = document.getElementById('dateColor').value;
        ctx.font = '600 20px sans-serif';
        ctx.fillText("WED, OCT 24", 180, posY - (size * 0.7));
      }

      const bottomY = posY + (size * 0.7);
      if (document.getElementById('showSteps').checked) {
        ctx.fillStyle = document.getElementById('stepsColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("👟 8,432", 110, bottomY);
      }
      if (document.getElementById('showHeart').checked) {
        ctx.fillStyle = document.getElementById('heartColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("❤️ 72", 250, bottomY);
      }
      if (document.getElementById('showBattery').checked) {
        ctx.fillStyle = document.getElementById('batteryColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("🔋 85%", 180, 50);
      }
    }

    ['timeColor', 'timeSize', 'timePosY', 'timeFont', 'showDate', 'dateColor',
     'showBattery', 'batteryColor', 'showSteps', 'stepsColor', 'showHeart', 'heartColor']
    .forEach(id => document.getElementById(id).addEventListener('input', renderPreview));

    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userBgImage = img;
            renderPreview();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    renderPreview();
  </script>
</body>
</html>
