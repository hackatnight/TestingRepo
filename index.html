<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Studio [Build 13.0]</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 15px; }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .workspace {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1050px;
    }
    .watch-bezel {
      width: 380px;
      height: 380px;
      background: #020617;
      border: 8px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8);
    }
    #watchCanvas {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #000;
    }
    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: #94a3b8; }
    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    input[type="color"] { height: 38px; padding: 2px; cursor: pointer; }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.btn-primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; cursor: pointer; }
    button.btn-primary:hover { background: #0369a1; }
    button.btn-secondary { background: #1e293b; cursor: pointer; }
    button.btn-danger { background: #991b1b; border-color: var(--danger); cursor: pointer; }
    button.btn-success { background: #059669; border-color: var(--success); font-weight: bold; cursor: pointer; }
    button.btn-success:hover { background: #047857; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .progress-bar-container {
      width: 100%;
      background: #090d16;
      border-radius: 6px;
      overflow: hidden;
      height: 14px;
      display: none;
      border: 1px solid var(--border);
      margin-top: 5px;
    }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

    #logBox {
      background: #020617;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.72rem;
      padding: 12px;
      border-radius: 8px;
      height: 190px;
      overflow-y: auto;
      margin-top: 15px;
      width: 100%;
      max-width: 800px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>HT37 Watch Face Studio</h1>
    <div class="badge">BUILD 13.0 - NATIVE FITCLOUD TEMPLATE INJECTOR</div>
  </header>

  <div class="workspace">
    <div class="preview-section">
      <div class="watch-bezel">
        <canvas id="watchCanvas" width="360" height="360"></canvas>
      </div>

      <div class="editor-panel" style="margin-top: 15px;">
        <span class="section-title">OTA Flashing Engine</span>
        <div class="inline-fields">
          <button id="btnConnect" class="btn-primary">1. Connect HT37</button>
          <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
        </div>
        <div class="inline-fields">
          <button id="btnPrepare" class="btn-secondary" disabled>2. Prepare Watch</button>
          <button id="btnFlash" class="btn-success" disabled>3. Flash to Watch</button>
        </div>
        <button id="btnExportBin" class="btn-secondary">Export Custom .BIN File</button>
        
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>

    <div class="editor-panel">
      <span class="section-title">Base Dial Template</span>
      <div class="form-group">
        <label>Load Real HT37 .BIN (from Pixel USB files/download)</label>
        <input type="file" id="binTemplateInput" accept=".bin">
      </div>

      <span class="section-title">Wallpaper</span>
      <div class="form-group">
        <label>Upload Artwork (or use current 360x360 canvas)</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>

      <span class="section-title">Clock Typography</span>
      <div class="inline-fields">
        <div class="form-group">
          <label>Color</label>
          <input type="color" id="timeColor" value="#ffffff">
        </div>
        <div class="form-group">
          <label>Size (px)</label>
          <input type="number" id="timeSize" value="64" min="20" max="120">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label>Position (Y)</label>
          <input type="range" id="timePosY" min="60" max="300" value="160">
        </div>
        <div class="form-group">
          <label>Font</label>
          <select id="timeFont">
            <option value="sans-serif">Modern Sans</option>
            <option value="monospace">Digital Monospace</option>
            <option value="Impact">Bold Impact</option>
          </select>
        </div>
      </div>

      <span class="section-title">Widgets</span>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showDate" checked> Date</label>
          <input type="color" id="dateColor" value="#38bdf8">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showBattery" checked> Battery</label>
          <input type="color" id="batteryColor" value="#4ade80">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showSteps" checked> Steps</label>
          <input type="color" id="stepsColor" value="#facc15">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showHeart" checked> Heart Rate</label>
          <input type="color" id="heartColor" value="#f87171">
        </div>
      </div>
    </div>
  </div>

  <div id="logBox">Status: Build 13.0 Ready. Connect HT37 via Bluetooth or export custom .bin for phone.</div>

  <script>
    const SERVICE_VENDOR_9966 = '00009966-3c17-d293-8e48-14fe2e4da212';
    const CHAR_VENDOR_TX     = '0000ffb1-0000-1000-8000-00805f9b34fb';
    const CHAR_VENDOR_RX     = '0000ffb2-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let charVendorTx = null;
    let charVendorRx = null;
    let isFlashing = false;
    let loadedTemplateBin = null;

    const logBox = document.getElementById('logBox');
    function log(msg) {
      console.log(msg);
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function setButtons(connected) {
      document.getElementById('btnDisconnect').disabled = !connected;
      document.getElementById('btnPrepare').disabled    = !connected;
      document.getElementById('btnFlash').disabled      = !connected;
    }

    async function sendVendorPacket(bytes) {
      if (!charVendorTx) return;
      const data = new Uint8Array(bytes);
      if (charVendorTx.properties.write) {
        await charVendorTx.writeValue(data);
      } else {
        await charVendorTx.writeValueWithoutResponse(data);
      }
    }

    // --- TEMPLATE LOADER ---
    document.getElementById('binTemplateInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          loadedTemplateBin = new Uint8Array(evt.target.result);
          log(`Genuine template loaded: ${file.name} (${loadedTemplateBin.byteLength} bytes).`);
          log('Realtek hardware pointers & font tables preserved!');
        };
        reader.readAsArrayBuffer(file);
      }
    });

    // --- 1. CONNECT HANDLER ---
    document.getElementById('btnConnect').onclick = async () => {
      try {
        log('Connecting to HT37...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { name: 'HT37' },
            { namePrefix: 'HT37' }
          ],
          optionalServices: [
            SERVICE_VENDOR_9966,
            '00001800-0000-1000-8000-00805f9b34fb',
            '0000180a-0000-1000-8000-00805f9b34fb'
          ]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          log('Notice: HT37 disconnected.');
          setButtons(false);
          charVendorTx = null;
          charVendorRx = null;
          isFlashing = false;
        });

        log('Connecting GATT Server...');
        const server = await bleDevice.gatt.connect();

        log('Waiting 800ms for Windows GATT initialization...');
        await sleep(800);

        const vService = await server.getPrimaryService(SERVICE_VENDOR_9966);
        charVendorTx = await vService.getCharacteristic(CHAR_VENDOR_TX);
        charVendorRx = await vService.getCharacteristic(CHAR_VENDOR_RX);

        await charVendorRx.startNotifications();
        charVendorRx.addEventListener('characteristicvaluechanged', (e) => {
          const b = new Uint8Array(e.target.value.buffer);
          if (b.length === 32) {
            log('--> Watch accepted OTA Mode! Screen is ready at 0%.');
          }
        });

        log('SUCCESS: HT37 connected! Click "2. Prepare Watch" to light up screen.');
        setButtons(true);

      } catch (err) {
        log('Connection failed: ' + err.message);
        setButtons(false);
      }
    };

    document.getElementById('btnDisconnect').onclick = () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      setButtons(false);
    };

    // --- 2. PREPARE WATCH ---
    document.getElementById('btnPrepare').onclick = async () => {
      if (!charVendorTx) {
        log('Error: Watch not connected. Click "1. Connect HT37" first.');
        return;
      }
      log('Transmitting Dial OTA Initiation packet...');
      const initPkt = new Uint8Array([0x01, 0, 0, 0, 0, 0, 0, 0, 0x01, 0xC3, 0x01, 0x00, 0x04]);
      await sendVendorPacket(initPkt);
      log('--> Watch screen should illuminate with the arrow progress circle (0%).');
    };

    // --- 3. BINARY COMPILER (INJECTS CANVAS INTO TEMPLATE) ---
    function compileWatchFace() {
      const imgData = ctx.getImageData(0, 0, 360, 360).data;
      const rawBmpSize = 360 * 360 * 2; // 259,200 bytes

      const rgb565Buf = new Uint8Array(rawBmpSize);
      let p = 0;
      for (let i = 0; i < imgData.length; i += 4) {
        const r = imgData[i];
        const g = imgData[i + 1];
        const b = imgData[i + 2];
        const color = ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
        rgb565Buf[p++] = color & 0xFF;
        rgb565Buf[p++] = (color >> 8) & 0xFF;
      }

      if (loadedTemplateBin) {
        log('Injecting custom artwork into genuine HT37 template .BIN...');
        const modifiedBin = new Uint8Array(loadedTemplateBin);
        // Target offset in TBUI template is located at image block
        const targetOffset = modifiedBin.length >= rawBmpSize ? (modifiedBin.length - rawBmpSize) : 32;
        modifiedBin.set(rgb565Buf, targetOffset);
        return modifiedBin;
      } else {
        log('Warning: Flashing without genuine base template. If watch rejects verify, load your template from phone.');
        const headerSize = 32;
        const bin = new Uint8Array(headerSize + rawBmpSize);
        bin[0] = 0x54; bin[1] = 0x42; bin[2] = 0x55; bin[3] = 0x49; // "TBUI"
        bin[4] = 360 & 0xFF; bin[5] = (360 >> 8) & 0xFF;
        bin[6] = 360 & 0xFF; bin[7] = (360 >> 8) & 0xFF;
        bin.set(rgb565Buf, headerSize);
        return bin;
      }
    }

    // --- EXPORT .BIN ---
    document.getElementById('btnExportBin').onclick = () => {
      const bin = compileWatchFace();
      const blob = new Blob([bin], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'HT37_Custom_Watchface.bin';
      a.click();
      URL.revokeObjectURL(url);
      log('Exported: HT37_Custom_Watchface.bin');
    };

    // --- 4. FLOW-CONTROLLED FLASH STREAM ---
    document.getElementById('btnFlash').onclick = async () => {
      if (!charVendorTx) {
        log('Error: Watch not connected. Click "1. Connect HT37" first.');
        return;
      }
      if (isFlashing) return;
      isFlashing = true;

      try {
        const bin = compileWatchFace();
        log(`Streaming binary: ${bin.byteLength} bytes...`);

        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';

        const CHUNK_SIZE = 20;
        let offset = 0;

        while (offset < bin.byteLength) {
          if (!charVendorTx) throw new Error('Watch disconnected during stream.');
          const chunk = bin.subarray(offset, Math.min(offset + CHUNK_SIZE, bin.byteLength));
          if (charVendorTx.properties.writeWithoutResponse) {
            await charVendorTx.writeValueWithoutResponse(chunk);
          } else {
            await charVendorTx.writeValue(chunk);
          }
          offset += chunk.length;

          await sleep(6);

          if (offset % 2500 === 0 || offset === bin.byteLength) {
            const percent = ((offset / bin.byteLength) * 100).toFixed(1);
            progressBar.style.width = percent + '%';
            log(`Progress: ${percent}% (${offset}/${bin.byteLength} bytes)`);
          }
        }

        log('Stream complete! Watch is verifying and applying watch face.');
      } catch (err) {
        log('Flashing error: ' + err.message);
      } finally {
        isFlashing = false;
      }
    };

    // Canvas Preview Engine
    const canvas = document.getElementById('watchCanvas');
    const ctx = canvas.getContext('2d');
    let userBgImage = null;

    function renderPreview() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 360, 360);
      if (userBgImage) ctx.drawImage(userBgImage, 0, 0, 360, 360);

      const timeStr = "10:08";
      const font = document.getElementById('timeFont').value;
      const size = document.getElementById('timeSize').value;
      const posY = parseInt(document.getElementById('timePosY').value);

      ctx.fillStyle = document.getElementById('timeColor').value;
      ctx.font = `bold ${size}px ${font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeStr, 180, posY);

      if (document.getElementById('showDate').checked) {
        ctx.fillStyle = document.getElementById('dateColor').value;
        ctx.font = '600 20px sans-serif';
        ctx.fillText("WED, OCT 24", 180, posY - (size * 0.7));
      }

      const bottomY = posY + (size * 0.7);
      if (document.getElementById('showSteps').checked) {
        ctx.fillStyle = document.getElementById('stepsColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("👟 8,432", 110, bottomY);
      }
      if (document.getElementById('showHeart').checked) {
        ctx.fillStyle = document.getElementById('heartColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("❤️ 72", 250, bottomY);
      }
      if (document.getElementById('showBattery').checked) {
        ctx.fillStyle = document.getElementById('batteryColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("🔋 85%", 180, 50);
      }
    }

    ['timeColor', 'timeSize', 'timePosY', 'timeFont', 'showDate', 'dateColor',
     'showBattery', 'batteryColor', 'showSteps', 'stepsColor', 'showHeart', 'heartColor']
    .forEach(id => document.getElementById(id).addEventListener('input', renderPreview));

    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userBgImage = img;
            renderPreview();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    renderPreview();
  </script>
</body>
</html>
