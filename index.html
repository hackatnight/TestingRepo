<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Studio [Build 9.0]</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 15px; }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .workspace {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1050px;
    }
    .watch-bezel {
      width: 380px;
      height: 380px;
      background: #020617;
      border: 8px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8);
    }
    #watchCanvas {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #000;
    }
    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: #94a3b8; }
    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    input[type="color"] { height: 38px; padding: 2px; cursor: pointer; }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.btn-primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; cursor: pointer; }
    button.btn-primary:hover { background: #0369a1; }
    button.btn-secondary { background: #1e293b; cursor: pointer; }
    button.btn-danger { background: #991b1b; border-color: var(--danger); cursor: pointer; }
    button.btn-success { background: #065f46; border-color: var(--success); cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    #logBox {
      background: #020617;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.72rem;
      padding: 12px;
      border-radius: 8px;
      height: 200px;
      overflow-y: auto;
      margin-top: 15px;
      width: 100%;
      max-width: 800px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>HT37 Watch Face Studio</h1>
    <div class="badge">BUILD 9.0 - CONTROLLED PAIRING & SCREEN WAKE</div>
  </header>

  <div class="workspace">
    <div class="preview-section">
      <div class="watch-bezel">
        <canvas id="watchCanvas" width="360" height="360"></canvas>
      </div>

      <div class="editor-panel" style="margin-top: 15px;">
        <span class="section-title">Hardware Link (00009966)</span>
        <div class="inline-fields">
          <button id="btnConnect" class="btn-primary">1. Connect HT37</button>
          <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
        </div>
        <div class="inline-fields">
          <button id="btnPair" class="btn-success" disabled>2. Request Watch Pairing</button>
          <button id="btnWake" class="btn-primary" disabled>3. Wake / Vibrate</button>
        </div>
        
        <span class="section-title" style="margin-top: 5px;">Raw Packet Console</span>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="hexInput" placeholder="e.g. 02 00 00 00 00 00 00 00 08 01 01 00 0c" style="flex: 1;">
          <button id="btnSendHex" class="btn-secondary" disabled>Send</button>
        </div>
      </div>
    </div>

    <div class="editor-panel">
      <span class="section-title">Wallpaper</span>
      <div class="form-group">
        <label>Upload Image (Auto-scaled to 360x360)</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>

      <span class="section-title">Clock Typography</span>
      <div class="inline-fields">
        <div class="form-group">
          <label>Color</label>
          <input type="color" id="timeColor" value="#ffffff">
        </div>
        <div class="form-group">
          <label>Size (px)</label>
          <input type="number" id="timeSize" value="64" min="20" max="120">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label>Position (Y)</label>
          <input type="range" id="timePosY" min="60" max="300" value="160">
        </div>
        <div class="form-group">
          <label>Font</label>
          <select id="timeFont">
            <option value="sans-serif">Modern Sans</option>
            <option value="monospace">Digital Monospace</option>
            <option value="Impact">Bold Impact</option>
          </select>
        </div>
      </div>

      <span class="section-title">Widgets</span>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showDate" checked> Date</label>
          <input type="color" id="dateColor" value="#38bdf8">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showBattery" checked> Battery</label>
          <input type="color" id="batteryColor" value="#4ade80">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showSteps" checked> Steps</label>
          <input type="color" id="stepsColor" value="#facc15">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showHeart" checked> Heart Rate</label>
          <input type="color" id="heartColor" value="#f87171">
        </div>
      </div>
    </div>
  </div>

  <div id="logBox">Status: Build 9.0 Ready. Click "1. Connect HT37" to pair.</div>

  <script>
    const SERVICE_VENDOR_9966 = '00009966-3c17-d293-8e48-14fe2e4da212';
    const CHAR_VENDOR_TX     = '0000ffb1-0000-1000-8000-00805f9b34fb';
    const CHAR_VENDOR_RX     = '0000ffb2-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let charVendorTx = null;
    let charVendorRx = null;
    let keepAliveTimer = null;

    const logBox = document.getElementById('logBox');
    function log(msg) {
      console.log(msg);
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function setButtons(connected) {
      document.getElementById('btnDisconnect').disabled = !connected;
      document.getElementById('btnPair').disabled       = !connected;
      document.getElementById('btnWake').disabled       = !connected;
      document.getElementById('btnSendHex').disabled    = !connected;
    }

    function make13BytePkt(header, cmd, sub = 0x01, val = 0x01) {
      const p = new Uint8Array(13);
      p[0] = header;
      p[8] = cmd;
      p[9] = sub;
      p[10] = val;
      p[11] = 0x00;
      let sum = 0;
      for (let i = 0; i < 12; i++) sum = (sum + p[i]) & 0xFF;
      p[12] = sum;
      return p;
    }

    async function sendVendorPacket(bytes) {
      if (!charVendorTx) return;
      const data = new Uint8Array(bytes);
      log(`TX [${data.length}B]: ${Array.from(data).map(x => x.toString(16).padStart(2, '0')).join(' ')}`);
      if (charVendorTx.properties.write) {
        await charVendorTx.writeValue(data);
      } else {
        await charVendorTx.writeValueWithoutResponse(data);
      }
    }

    function stopKeepAlive() {
      if (keepAliveTimer) {
        clearInterval(keepAliveTimer);
        keepAliveTimer = null;
      }
    }

    function startKeepAlive() {
      stopKeepAlive();
      // Steady 4-second keep-alive to maintain connection without flooding
      keepAliveTimer = setInterval(async () => {
        if (charVendorTx && bleDevice && bleDevice.gatt.connected) {
          try {
            const ping = make13BytePkt(0x01, 0x00, 0x00, 0x00);
            await charVendorTx.writeValueWithoutResponse(ping);
          } catch (e) {}
        }
      }, 4000);
    }

    // --- 1. CONNECT HANDLER ---
    document.getElementById('btnConnect').onclick = async () => {
      try {
        stopKeepAlive();
        log('Connecting to HT37...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { name: 'HT37' },
            { namePrefix: 'HT37' }
          ],
          optionalServices: [
            SERVICE_VENDOR_9966,
            '00001800-0000-1000-8000-00805f9b34fb',
            '0000180a-0000-1000-8000-00805f9b34fb'
          ]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          log('Notice: HT37 disconnected.');
          stopKeepAlive();
          setButtons(false);
          charVendorTx = null;
          charVendorRx = null;
        });

        log('Connecting GATT Server...');
        const server = await bleDevice.gatt.connect();

        log('Waiting 800ms for Windows GATT initialization...');
        await sleep(800);

        const vService = await server.getPrimaryService(SERVICE_VENDOR_9966);
        charVendorTx = await vService.getCharacteristic(CHAR_VENDOR_TX);
        charVendorRx = await vService.getCharacteristic(CHAR_VENDOR_RX);

        // RX Notification Router (Passive monitoring only - NO recursive looping)
        await charVendorRx.startNotifications();
        charVendorRx.addEventListener('characteristicvaluechanged', (e) => {
          const b = new Uint8Array(e.target.value.buffer);
          log(`RX [${b.length}B]: ${Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ')}`);

          if (b[0] === 0x81 && b[8] === 0x01) {
            log('--> Watch is waiting for Pairing Authorization. Click "2. Request Watch Pairing" below and tap "Agree" on your watch screen.');
          } else if (b[0] === 0x82 && b[8] !== 0x40) {
            log(`--> Command accepted! Return status: 0x${b[8].toString(16)}`);
          } else if (b[0] === 0x82 && b[8] === 0x40) {
            log('--> Watch replied 0x40 (Unauthorized). You must tap "Agree" on the watch screen to authorize.');
          }
        });

        startKeepAlive();
        log('SUCCESS: Connection open! Click "2. Request Watch Pairing".');
        setButtons(true);

      } catch (err) {
        log('Connection failed: ' + err.message);
        stopKeepAlive();
        setButtons(false);
      }
    };

    document.getElementById('btnDisconnect').onclick = () => {
      stopKeepAlive();
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      setButtons(false);
    };

    // --- 2. REQUEST PAIRING / HANDSHAKE ---
    document.getElementById('btnPair').onclick = async () => {
      if (!charVendorTx) return;
      log('Transmitting single Bind Request to watch...');
      
      // Send single Bind Frame: [0x01, 7 zeros, 0x01, 0xC3, 0x01, 0x00, 0x04]
      const bindPkt = new Uint8Array([0x01, 0, 0, 0, 0, 0, 0, 0, 0x01, 0xC3, 0x01, 0x00, 0x04]);
      await sendVendorPacket(bindPkt);
      
      log('>>> LOOK AT YOUR WATCH SCREEN NOW! <<<');
      log('If a pop-up appears with a Green Checkmark or "Agree / Pair", tap it immediately.');
    };

    // --- 3. WAKE / VIBRATE ---
    document.getElementById('btnWake').onclick = async () => {
      if (!charVendorTx) return;
      log('Transmitting Find Watch / Vibrate (0x08)...');
      await sendVendorPacket(make13BytePkt(0x02, 0x08, 0x01, 0x01));
      await sleep(350);
      log('Transmitting Screen Light Up (0x0E)...');
      await sendVendorPacket(make13BytePkt(0x02, 0x0E, 0x01, 0x01));
    };

    // --- RAW HEX SENDER ---
    document.getElementById('btnSendHex').onclick = async () => {
      const hex = document.getElementById('hexInput').value.trim();
      if (!hex) return;
      const bytes = hex.split(/[\s,]+/).map(b => parseInt(b, 16)).filter(b => !isNaN(b));
      if (bytes.length === 0) return;
      await sendVendorPacket(bytes);
    };

    // Canvas Preview
    const canvas = document.getElementById('watchCanvas');
    const ctx = canvas.getContext('2d');
    let userBgImage = null;

    function renderPreview() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 360, 360);
      if (userBgImage) ctx.drawImage(userBgImage, 0, 0, 360, 360);

      const timeStr = "10:08";
      const font = document.getElementById('timeFont').value;
      const size = document.getElementById('timeSize').value;
      const posY = parseInt(document.getElementById('timePosY').value);

      ctx.fillStyle = document.getElementById('timeColor').value;
      ctx.font = `bold ${size}px ${font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeStr, 180, posY);

      if (document.getElementById('showDate').checked) {
        ctx.fillStyle = document.getElementById('dateColor').value;
        ctx.font = '600 20px sans-serif';
        ctx.fillText("WED, OCT 24", 180, posY - (size * 0.7));
      }

      const bottomY = posY + (size * 0.7);
      if (document.getElementById('showSteps').checked) {
        ctx.fillStyle = document.getElementById('stepsColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("👟 8,432", 110, bottomY);
      }
      if (document.getElementById('showHeart').checked) {
        ctx.fillStyle = document.getElementById('heartColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("❤️ 72", 250, bottomY);
      }
      if (document.getElementById('showBattery').checked) {
        ctx.fillStyle = document.getElementById('batteryColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("🔋 85%", 180, 50);
      }
    }

    ['timeColor', 'timeSize', 'timePosY', 'timeFont', 'showDate', 'dateColor',
     'showBattery', 'batteryColor', 'showSteps', 'stepsColor', 'showHeart', 'heartColor']
    .forEach(id => document.getElementById(id).addEventListener('input', renderPreview));

    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userBgImage = img;
            renderPreview();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    renderPreview();
  </script>
</body>
</html>
