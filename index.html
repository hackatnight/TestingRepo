<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HT37 Watch Face Studio & Web BLE Pusher</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-bg: #151d30;
            --panel-border: #263352;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --success: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .workspace {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 28px;
            max-width: 1100px;
            width: 100%;
        }
        @media (max-width: 860px) { .workspace { grid-template-columns: 1fr; } }
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; font-size: 1.15rem; }
        .watch-bezel {
            width: 240px;
            height: 286px;
            background: #000;
            margin: 0 auto 16px;
            border-radius: 38px;
            border: 8px solid #2d3748;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        canvas#dialCanvas { width: 100%; height: 100%; display: block; }
        .field-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: #0d1527;
            color: var(--text-main);
            box-sizing: border-box;
        }
        .btn-row { display: flex; gap: 10px; }
        button {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-gray { background: #334155; color: white; }
        .terminal {
            background: #050811;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            height: 220px;
            overflow-y: auto;
            color: #38bdf8;
            margin-top: 14px;
            line-height: 1.45;
        }
        .progress-bar-bg {
            background: #1e293b;
            border-radius: 6px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.08s ease;
        }
    </style>
</head>
<body>
<div class="workspace">
    <div class="card">
        <h2>Watch Canvas</h2>
        <div class="watch-bezel">
            <canvas id="dialCanvas" width="240" height="286"></canvas>
        </div>
        <div class="field-group">
            <label>Wallpaper</label>
            <input type="file" id="inputImage" accept="image/*">
        </div>
        <div class="field-group">
            <label>Clock Color</label>
            <input type="color" id="inputColor" value="#f8fafc">
        </div>
        <div class="field-group">
            <label>Time Position (Y)</label>
            <input type="range" id="inputTimeY" min="40" max="220" value="85">
        </div>
        <button class="btn-gray" id="btnDownload" style="width: 100%; margin-top: 10px;">Save .bin Package</button>
    </div>
    <div class="card">
        <h2>Watch Connection & Transmission</h2>
        <div class="field-group">
            <label>Target Service (Auto or Custom UUID)</label>
            <select id="selectService">
                <option value="AUTO">Auto-Scan Known FitCloud/Realtek Services</option>
                <option value="0000e0ff-3c17-d293-8e48-14fe2e4da212">0000e0ff-3c17-d293-8e48-14fe2e4da212 (Realtek Comm)</option>
                <option value="0000d0ff-3c17-d293-8e48-14fe2e4da212">0000d0ff-3c17-d293-8e48-14fe2e4da212 (Realtek OTA)</option>
                <option value="00001601-0000-1000-8000-00805f9b34fb">00001601-0000-1000-8000-00805f9b34fb (Linwear/FitCloud 1601)</option>
                <option value="00001600-0000-1000-8000-00805f9b34fb">00001600-0000-1000-8000-00805f9b34fb (Linwear/FitCloud 1600)</option>
                <option value="6e400001-b5a3-f393-e0a9-e50e24dcca9f">6e400001-b5a3-f393-e0a9-e50e24dcca9f (Nordic UART)</option>
                <option value="0000feea-0000-1000-8000-00805f9b34fb">0000feea-0000-1000-8000-00805f9b34fb (FitCloud FEEA)</option>
                <option value="CUSTOM">Custom UUID (Enter manually below)</option>
            </select>
            <input type="text" id="customUuidInput" placeholder="Paste custom service UUID here..." style="display:none; margin-top: 6px;">
        </div>

        <div class="btn-row" style="margin-bottom: 10px;">
            <button class="btn-blue" id="btnBleConnect" style="flex: 1;">1. Connect Watch</button>
            <button class="btn-green" id="btnBlePush" style="flex: 1;" disabled>2. Push Dial</button>
        </div>
        <button class="btn-gray" id="btnSimulate" style="width: 100%; font-size: 0.8rem; padding: 6px;">Simulate Push (Test Run)</button>
        <div class="progress-bar-bg" id="progBarContainer">
            <div class="progress-bar-fill" id="progBar"></div>
        </div>
        <div class="terminal" id="termLog"></div>
    </div>
</div>
<script>
    const WIDTH = 240, HEIGHT = 286;
    const canvas = document.getElementById('dialCanvas'), ctx = canvas.getContext('2d');
    let loadedImage = null, textColor = "#f8fafc", timeY = 85;

    function log(m) {
        const term = document.getElementById('termLog');
        term.innerHTML += '<div>[' + new Date().toTimeString().split(' ')[0] + '] ' + m + '</div>';
        term.scrollTop = term.scrollHeight;
    }

    document.getElementById('selectService').onchange = (e) => {
        document.getElementById('customUuidInput').style.display = (e.target.value === 'CUSTOM') ? 'block' : 'none';
    };

    function createDefaultWallpaper() {
        const off = document.createElement('canvas'); off.width = WIDTH; off.height = HEIGHT;
        const octx = off.getContext('2d');
        const g = octx.createLinearGradient(0, 0, WIDTH, HEIGHT);
        g.addColorStop(0, "#1e3a8a"); g.addColorStop(0.5, "#0f172a"); g.addColorStop(1, "#311042");
        octx.fillStyle = g; octx.fillRect(0, 0, WIDTH, HEIGHT);
        const img = new Image(); img.onload = () => { loadedImage = img; render(); };
        img.src = off.toDataURL();
    }

    function render() {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
        if (loadedImage) ctx.drawImage(loadedImage, 0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = textColor;
        ctx.font = "bold 44px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("10:08", WIDTH / 2, timeY);
        ctx.font = "600 13px system-ui, sans-serif";
        ctx.fillText("THU, OCT 22", WIDTH / 2, timeY + 34);
        ctx.font = "500 12px system-ui, sans-serif";
        ctx.fillText("👟 7,842 steps", WIDTH / 2, timeY + 54);
    }

    document.getElementById('inputImage').onchange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const r = new FileReader(); r.onload = (ev) => { const img = new Image(); img.onload = () => { loadedImage = img; render(); }; img.src = ev.target.result; };
        r.readAsDataURL(file);
    };
    document.getElementById('inputColor').oninput = (e) => { textColor = e.target.value; render(); };
    document.getElementById('inputTimeY').oninput = (e) => { timeY = parseInt(e.target.value); render(); };

    function packDialBinary() {
        const d = ctx.getImageData(0, 0, WIDTH, HEIGHT).data;
        const rgb565 = new Uint8Array(WIDTH * HEIGHT * 2);
        for (let i = 0; i < WIDTH * HEIGHT; i++) {
            const val = (((d[i * 4] >> 3) & 0x1F) << 11) | (((d[i * 4 + 1] >> 2) & 0x3F) << 5) | ((d[i * 4 + 2] >> 3) & 0x1F);
            rgb565[i * 2] = val & 0xFF; rgb565[i * 2 + 1] = (val >> 8) & 0xFF;
        }
        const header = new Uint8Array(64);
        const v = new DataView(header.buffer);
        header[0] = 0x44; header[1] = 0x49; header[2] = 0x41; header[3] = 0x4C; // DIAL
        v.setUint16(4, 0x0100, true); v.setUint16(6, WIDTH, true); v.setUint16(8, HEIGHT, true);
        v.setUint16(10, 16, true); v.setUint32(12, 64, true); v.setUint32(16, rgb565.length, true);
        v.setUint16(20, WIDTH / 2, true); v.setUint16(22, timeY, true);
        const hex = textColor.replace('#', '');
        v.setUint16(24, (((parseInt(hex.substr(0, 2), 16) >> 3) & 0x1F) << 11) | (((parseInt(hex.substr(2, 2), 16) >> 2) & 0x3F) << 5) | ((parseInt(hex.substr(4, 2), 16) >> 3) & 0x1F), true);

        const out = new Uint8Array(header.length + rgb565.length);
        out.set(header, 0); out.set(rgb565, header.length);
        return out;
    }

    document.getElementById('btnDownload').onclick = () => {
        const b = new Blob([packDialBinary()], { type: "application/octet-stream" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = "ht37_watchface.bin"; a.click();
        log("Saved ht37_watchface.bin");
    };

    // Full set of Realtek, Nordic, and Topstep Smartwatch GATT UUIDs
    const ALL_KNOWN_SERVICES = [
        '0000e0ff-3c17-d293-8e48-14fe2e4da212',
        '0000d0ff-3c17-d293-8e48-14fe2e4da212',
        '00006287-3c17-d293-8e48-14fe2e4da212',
        '00000aa0-3c17-d293-8e48-14fe2e4da212',
        '6e400001-b5a3-f393-e0a9-e50e24dcca9f',
        '00001600-0000-1000-8000-00805f9b34fb',
        '00001601-0000-1000-8000-00805f9b34fb',
        '00001602-0000-1000-8000-00805f9b34fb',
        '00005833-0000-1000-8000-00805f9b34fb',
        '0000feea-0000-1000-8000-00805f9b34fb',
        '0000fee7-0000-1000-8000-00805f9b34fb',
        '0000fff0-0000-1000-8000-00805f9b34fb',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ffd0-0000-1000-8000-00805f9b34fb',
        '0000180a-0000-1000-8000-00805f9b34fb',
        '0000180f-0000-1000-8000-00805f9b34fb',
        '0000180d-0000-1000-8000-00805f9b34fb'
    ];

    let rxChar = null;

    document.getElementById('btnBleConnect').onclick = async () => {
        try {
            const selectVal = document.getElementById('selectService').value;
            let targetList = ALL_KNOWN_SERVICES;

            if (selectVal === 'CUSTOM') {
                const custom = document.getElementById('customUuidInput').value.trim().toLowerCase();
                if (custom) targetList = [custom];
            } else if (selectVal !== 'AUTO') {
                targetList = [selectVal];
            }

            log("Prompting Bluetooth pairing dialog...");
            const dev = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "HT37" }, { namePrefix: "Watch" }],
                optionalServices: targetList
            });

            log("Connecting to GATT server on " + (dev.name || "HT37") + "...");
            const srv = await dev.gatt.connect();

            rxChar = null;
            let foundService = null;

            // Try each allowed service in sequence
            for (const uuid of targetList) {
                try {
                    const s = await srv.getPrimaryService(uuid);
                    if (s) {
                        foundService = s;
                        log("<b style='color:#34d399;'>Matched Service: " + uuid + "</b>");
                        const chars = await s.getCharacteristics();
                        for (const c of chars) {
                            const w = c.properties.write || c.properties.writeWithoutResponse;
                            log("  * Characteristic: " + c.uuid + " [write=" + w + ", notify=" + c.properties.notify + "]");
                            if (!rxChar && w) rxChar = c;
                        }
                        if (rxChar) break;
                    }
                } catch (e) {
                    // Service not on device, continue scanning
                }
            }

            if (rxChar) {
                document.getElementById('btnBlePush').disabled = false;
                log("<b style='color:#10b981;'>Ready! Write Characteristic: " + rxChar.uuid + "</b>");
            } else {
                log("<b style='color:#f59e0b;'>Connected, but none of the candidate services matched. Open chrome://bluetooth-internals/#devices in a new tab to see your watch's exact UUID.</b>");
            }
        } catch (e) {
            log("<b style='color:#ef4444;'>BLE Error: " + e.message + "</b>");
            log("Tip: Make sure phone Bluetooth is OFF so the watch is not in-use.");
        }
    };

    async function send(sim) {
        const bin = packDialBinary(), chunk = 240, total = Math.ceil(bin.length / chunk);
        const pbg = document.getElementById('progBarContainer'), pf = document.getElementById('progBar');
        pbg.style.display = 'block'; pf.style.width = '0%';
        log("Transmitting " + bin.length + " bytes (" + total + " packets)...");
        try {
            if (!sim && rxChar) {
                const init = new Uint8Array([0x02, 0x01, 0, 0, 0, 0, 0, 0]);
                new DataView(init.buffer).setUint32(2, bin.length, true);
                await rxChar.writeValue(init);
            }
            for (let i = 0; i < total; i++) {
                if (!sim && rxChar) await rxChar.writeValueWithoutResponse(bin.slice(i * chunk, (i + 1) * chunk));
                else await new Promise(r => setTimeout(r, 6));
                pf.style.width = Math.round(((i + 1) / total) * 100) + '%';
            }
            log("Push finished successfully!");
        } catch (e) { log("Push Error: " + e.message); }
    }

    document.getElementById('btnBlePush').onclick = () => send(false);
    document.getElementById('btnSimulate').onclick = () => send(true);
    createDefaultWallpaper();
    log("HT37 Studio Ready.");
</script>
</body>
</html>
