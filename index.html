<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Data Harvester [Build 20.0]</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #10b981;
      --warn: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 1.4rem; color: var(--accent); }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .card-value { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    button {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-primary { background: #0284c7; border-color: #38bdf8; }
    button.btn-danger { background: #991b1b; border-color: var(--danger); }
    button.btn-success { background: #059669; border-color: var(--success); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .terminal-row {
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .terminal-row input {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    #logTable {
      width: 100%;
      height: 380px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-y: auto;
      padding: 10px;
      font-family: Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .rx-line { color: #4ade80; }
    .tx-line { color: #38bdf8; }
    .sys-line { color: #facc15; }
    .val-line { color: #c084fc; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>HT37 Telemetry Harvester</h1>
    <div class="badge">BUILD 20.0 - 13-BYTE PROTOCOL HARVESTER</div>
  </header>

  <div class="container">
    <div class="grid">
      <div class="card">
        <span class="card-label">Link Status</span>
        <div class="card-value" id="valStatus" style="color:var(--danger)">Disconnected</div>
      </div>
      <div class="card">
        <span class="card-label">Last Decoded Value</span>
        <div class="card-value" id="valDecoded">--</div>
      </div>
      <div class="card">
        <span class="card-label">Reported Dial Capacity</span>
        <div class="card-value" id="valCapacity">--</div>
      </div>
      <div class="card">
        <span class="card-label">Packets Logged</span>
        <div class="card-value" id="valPackets">0 RX / 0 TX</div>
      </div>
    </div>

    <div class="action-bar">
      <button id="btnConnect" class="btn-primary">1. Connect HT37</button>
      <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
      <button id="btnHarvestAll" class="btn-success" disabled>2. Harvest All Watch Telemetry</button>
      <button id="btnWakeScreen" disabled>Trigger Screen Wake</button>
      <button id="btnExportLog">Export Harvester Log (.txt)</button>
      <button id="btnClearLog">Clear Log</button>
    </div>

    <div class="terminal-row">
      <input type="text" id="customHex" placeholder="Enter custom 13-byte packet or opcode (e.g. 02 00 00 00 00 00 00 00 03 00 00 00 05)">
      <button id="btnSendCustom" class="btn-primary" disabled>Send 13B Packet</button>
    </div>

    <div id="logTable">Build 20.0 Ready. Turn phone Bluetooth OFF, then click '1. Connect HT37'.</div>
  </div>

  <script>
    const SERVICE_VENDOR_9966 = '00009966-3c17-d293-8e48-14fe2e4da212';
    const CHAR_VENDOR_TX      = '0000ffb1-0000-1000-8000-00805f9b34fb';
    const CHAR_VENDOR_RX      = '0000ffb2-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let gattServer = null;
    let charVendorTx = null;
    let charVendorRx = null;
    let rxCount = 0;
    let txCount = 0;
    let fullSessionLog = "";

    const logEl = document.getElementById('logTable');

    function log(msg, type = 'sys') {
      const ts = new Date().toLocaleTimeString();
      const line = `[${ts}] ${msg}`;
      fullSessionLog += line + "\n";
      
      const div = document.createElement('div');
      div.className = `${type}-line`;
      div.textContent = line;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function updateCounters() {
      document.getElementById('valPackets').textContent = `${rxCount} RX / ${txCount} TX`;
    }

    // Helper to generate a valid 13-byte frame
    function make13BytePacket(opcode, param0 = 0, param1 = 0, param2 = 0, param3 = 0, tag = 0) {
      const pkt = new Uint8Array(13);
      pkt[0] = opcode;
      // bytes 1..7 are 0
      pkt[8] = param0;
      pkt[9] = param1;
      pkt[10] = param2;
      pkt[11] = param3;
      pkt[12] = tag === 0 ? ((opcode + param0 + param1 + param2 + param3) & 0xFF) : tag;
      return pkt;
    }

    async function send13B(pkt, label = '') {
      if (!charVendorTx) return;
      const hex = Array.from(pkt).map(x => x.toString(16).padStart(2, '0')).join(' ');
      if (charVendorTx.properties.write) {
        await charVendorTx.writeValue(pkt);
      } else {
        await charVendorTx.writeValueWithoutResponse(pkt);
      }
      txCount++;
      updateCounters();
      log(`>> TX [13B]: ${hex} ${label ? '(' + label + ')' : ''}`, 'tx');
    }

    // --- 1. CONNECT ---
    document.getElementById('btnConnect').onclick = async () => {
      try {
        log('Scanning for HT37...', 'sys');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'HT37' }, { namePrefix: 'HT37' }],
          optionalServices: [
            SERVICE_VENDOR_9966,
            '00001800-0000-1000-8000-00805f9b34fb'
          ]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          log('Notice: Watch disconnected.', 'sys');
          document.getElementById('valStatus').textContent = 'Disconnected';
          document.getElementById('valStatus').style.color = 'var(--danger)';
          toggleButtons(false);
        });

        gattServer = await bleDevice.gatt.connect();
        document.getElementById('valStatus').textContent = 'Connected';
        document.getElementById('valStatus').style.color = 'var(--success)';
        log(`Connected to GATT server on ${bleDevice.name}!`, 'sys');
        toggleButtons(true);

        const vService = await gattServer.getPrimaryService(SERVICE_VENDOR_9966);
        charVendorTx = await vService.getCharacteristic(CHAR_VENDOR_TX);
        charVendorRx = await vService.getCharacteristic(CHAR_VENDOR_RX);

        await charVendorRx.startNotifications();
        charVendorRx.addEventListener('characteristicvaluechanged', (e) => {
          rxCount++;
          updateCounters();
          const b = new Uint8Array(e.target.value.buffer);
          const hex = Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ');
          
          if (b.length === 13) {
            // Decode 4-byte little-endian value at bytes 8..11
            const val32 = b[8] | (b[9] << 8) | (b[10] << 16) | (b[11] << 24);
            const opcodeHex = `0x${b[0].toString(16).toUpperCase()}`;

            let interpretation = `Val: ${val32} (0x${val32.toString(16)})`;
            if (b[0] === 0xA0) {
              interpretation = `Max Slot Capacity: ${val32} bytes (~${Math.round(val32/1024)} KB)`;
              document.getElementById('valCapacity').textContent = `${val32} B`;
            }

            document.getElementById('valDecoded').textContent = `${opcodeHex}: ${val32}`;
            log(`<< RX [13B]: ${hex} --> [${opcodeHex}] ${interpretation}`, 'rx');
          } else {
            log(`<< RX [${b.length}B]: ${hex}`, 'rx');
          }
        });

        log('SUCCESS: Subscribed to live RX notifications. Click "2. Harvest All Watch Telemetry".', 'sys');

      } catch (err) {
        log('Connection error: ' + err.message, 'sys');
      }
    };

    function toggleButtons(connected) {
      document.getElementById('btnDisconnect').disabled = !connected;
      document.getElementById('btnHarvestAll').disabled = !connected;
      document.getElementById('btnWakeScreen').disabled = !connected;
      document.getElementById('btnSendCustom').disabled = !connected;
    }

    document.getElementById('btnDisconnect').onclick = () => {
      if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
    };

    // --- 2. HARVEST TELEMETRY (ALL 13-BYTE PACKETS) ---
    document.getElementById('btnHarvestAll').onclick = async () => {
      log('--- STARTING 13-BYTE PROTOCOL HARVEST ---', 'val');

      const probes = [
        { name: 'Probe Battery (0x02 sub 0x03)', pkt: make13BytePacket(0x02, 0x03, 0, 0, 0, 0x05) },
        { name: 'Probe Device Info (0x02 sub 0x01)', pkt: make13BytePacket(0x02, 0x01, 0, 0, 0, 0x03) },
        { name: 'Probe LCD Shape / Res (0x02 sub 0x05)', pkt: make13BytePacket(0x02, 0x05, 0, 0, 0, 0x07) },
        { name: 'Probe UI / Tool Version (0x02 sub 0x07)', pkt: make13BytePacket(0x02, 0x07, 0, 0, 0, 0x09) },
        { name: 'Probe Dial Spaces (0x02 sub 0x08)', pkt: make13BytePacket(0x02, 0x08, 0, 0, 0, 0x0A) },
        { name: 'Probe Sensor Stream (0x03 sub 0x01)', pkt: make13BytePacket(0x03, 0x01, 0, 0, 0, 0x04) },
        { name: 'Probe Config Read (0xA0 sub 0x01)', pkt: make13BytePacket(0xA0, 0x01, 0, 0, 0, 0xA1) },
        { name: 'Probe Status Query (0xB0 sub 0x01)', pkt: make13BytePacket(0xB0, 0x01, 0, 0, 0, 0xB1) }
      ];

      for (const p of probes) {
        log(`Transmitting: ${p.name}...`, 'sys');
        await send13B(p.pkt, p.name);
        await sleep(900); // 900ms response window
      }

      log('--- HARVEST COMPLETED. Check received decoded metrics above. ---', 'val');
    };

    // Screen Wake
    document.getElementById('btnWakeScreen').onclick = async () => {
      const wakePkt = new Uint8Array([0x01, 0, 0, 0, 0, 0, 0, 0, 0x01, 0xC3, 0x01, 0x00, 0x04]);
      await send13B(wakePkt, 'Screen Wake Trigger');
    };

    // Custom 13-byte Sender
    document.getElementById('btnSendCustom').onclick = async () => {
      const raw = document.getElementById('customHex').value.trim();
      if (!raw) return;
      const clean = raw.replace(/0x/g, '').replace(/[\s,]/g, '');
      const bytes = [];
      for (let i = 0; i < clean.length; i += 2) {
        bytes.push(parseInt(clean.substr(i, 2), 16));
      }
      
      let pkt;
      if (bytes.length === 13) {
        pkt = new Uint8Array(bytes);
      } else if (bytes.length <= 5) {
        // Automatically frame into 13 bytes
        pkt = make13BytePacket(bytes[0] || 0, bytes[1] || 0, bytes[2] || 0, bytes[3] || 0, bytes[4] || 0);
      } else {
        alert('Please enter either 13 bytes or a short opcode array.');
        return;
      }
      await send13B(pkt, 'Custom Terminal Send');
    };

    document.getElementById('btnClearLog').onclick = () => {
      logEl.innerHTML = '';
      fullSessionLog = '';
    };

    document.getElementById('btnExportLog').onclick = () => {
      const blob = new Blob([fullSessionLog], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `HT37_Harvest_Log_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
</html>
