<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Studio [V3.0]</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 15px; }
    header h1 { font-size: 1.6rem; color: var(--accent); }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 5px;
    }
    .workspace {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }
    .watch-bezel {
      width: 380px;
      height: 380px;
      background: #020617;
      border: 8px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.7);
    }
    #watchCanvas {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #000;
    }
    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: #cbd5e1; }
    input, select, button {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    input[type="color"] { height: 36px; padding: 2px; cursor: pointer; }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.btn-primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; cursor: pointer; }
    button.btn-primary:hover { background: #0369a1; }
    button.btn-secondary { background: #334155; cursor: pointer; }
    button.btn-danger { background: #991b1b; border-color: var(--danger); cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .progress-bar-container {
      width: 100%;
      background: #0f172a;
      border-radius: 6px;
      overflow: hidden;
      height: 12px;
      display: none;
    }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }
    
    #logBox {
      background: #000;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.72rem;
      padding: 12px;
      border-radius: 8px;
      height: 150px;
      overflow-y: auto;
      margin-top: 15px;
      width: 100%;
      max-width: 780px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>HT37 Watch Face Studio</h1>
    <div class="badge">ENGINE V3.0 - RAW GATT EXPLORER</div>
  </header>

  <div class="workspace">
    <!-- Watch Preview -->
    <div class="preview-section">
      <div class="watch-bezel">
        <canvas id="watchCanvas" width="360" height="360"></canvas>
      </div>
      <div class="editor-panel" style="margin-top: 15px;">
        <span class="section-title">Bluetooth Manager</span>
        <div class="inline-fields">
          <button id="btnConnect" class="btn-primary">1. Pair HT37</button>
          <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
        </div>
        <div class="inline-fields">
          <button id="btnPing" class="btn-secondary" disabled>2. Wake / Vibrate</button>
          <button id="btnFlash" class="btn-primary" disabled>3. Flash Watch</button>
        </div>
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>

    <!-- Watchface Customizer -->
    <div class="editor-panel">
      <span class="section-title">Wallpaper</span>
      <div class="form-group">
        <label>Custom Image (Auto 360x360)</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>

      <span class="section-title">Time Display</span>
      <div class="inline-fields">
        <div class="form-group">
          <label>Color</label>
          <input type="color" id="timeColor" value="#ffffff">
        </div>
        <div class="form-group">
          <label>Font Size</label>
          <input type="number" id="timeSize" value="64" min="20" max="120">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label>Vertical Position</label>
          <input type="range" id="timePosY" min="60" max="300" value="160">
        </div>
        <div class="form-group">
          <label>Font Style</label>
          <select id="timeFont">
            <option value="sans-serif">Modern Sans</option>
            <option value="monospace">Digital Monospace</option>
            <option value="Impact">Bold Impact</option>
          </select>
        </div>
      </div>

      <span class="section-title">Fitness Widgets</span>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showDate" checked> Date</label>
          <input type="color" id="dateColor" value="#38bdf8">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showBattery" checked> Battery</label>
          <input type="color" id="batteryColor" value="#4ade80">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showSteps" checked> Steps</label>
          <input type="color" id="stepsColor" value="#facc15">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showHeart" checked> Heart Rate</label>
          <input type="color" id="heartColor" value="#f87171">
        </div>
      </div>
    </div>
  </div>

  <div id="logBox">[ENGINE V3.0 READY] Factory reset your watch, ensure Phone Bluetooth is OFF, and click "1. Pair HT37".</div>

  <script>
    // Standard MoYoung / DaFit GATT service specifications
    const PRIMARY_FEEA = '0000feea-0000-1000-8000-00805f9b34fb';
    const PRIMARY_FEE7 = '0000fee7-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let charOut = null;
    let charIn = null;

    const logBox = document.getElementById('logBox');
    function log(msg) {
      console.log(msg);
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function buildPacket(command, payload = []) {
      const totalLen = 5 + payload.length;
      const pkt = new Uint8Array(totalLen);
      pkt[0] = 0xFE;
      pkt[1] = 0xEA;
      pkt[2] = ((totalLen >> 8) & 0x0F) | 0x20;
      pkt[3] = totalLen & 0xFF;
      pkt[4] = command;
      for (let i = 0; i < payload.length; i++) {
        pkt[5 + i] = payload[i];
      }
      return pkt;
    }

    function cleanupConnection() {
      if (bleDevice && bleDevice.gatt.connected) {
        log('Closing GATT link...');
        bleDevice.gatt.disconnect();
      }
      charOut = null;
      charIn = null;
      document.getElementById('btnPing').disabled = true;
      document.getElementById('btnFlash').disabled = true;
      document.getElementById('btnDisconnect').disabled = true;
    }

    document.getElementById('btnDisconnect').onclick = () => {
      cleanupConnection();
      log('Disconnected.');
    };

    // --- PAIRING & CONNECTION ROUTINE ---
    document.getElementById('btnConnect').onclick = async () => {
      try {
        cleanupConnection();

        log('[1/4] Scanning for HT37 via MoYoung filters...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { services: [PRIMARY_FEEA] },
            { services: [PRIMARY_FEE7] },
            { namePrefix: 'HT37' }
          ],
          optionalServices: [PRIMARY_FEEA, PRIMARY_FEE7, 0xfee0, 0x1800, 0x180a]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          log('Notice: Watch disconnected.');
          cleanupConnection();
        });

        log(`[2/4] Selected: ${bleDevice.name || 'HT37'}. Connecting GATT server...`);
        const server = await bleDevice.gatt.connect();

        // 1000ms delay to let Windows Bluetooth stack enumerate services
        log('[3/4] Connected! Waiting 1s for Windows GATT database enumeration...');
        await sleep(1000);

        let activeService = null;
        try {
          activeService = await server.getPrimaryService(PRIMARY_FEEA);
          log(' -> Bound to Primary Service: FEEA');
        } catch (e1) {
          try {
            activeService = await server.getPrimaryService(PRIMARY_FEE7);
            log(' -> Bound to Alternate Service: FEE7');
          } catch (e2) {
            throw new Error('Neither FEEA nor FEE7 found. Please verify the watch was factory reset.');
          }
        }

        log('[4/4] Locating TX / RX characteristics...');
        const characteristics = await activeService.getCharacteristics();

        for (const c of characteristics) {
          const u = c.uuid.toLowerCase();
          const p = c.properties;
          log(`Found Char: ${u.substring(4, 8)} [write:${p.write || p.writeWithoutResponse}, notify:${p.notify}]`);

          if (!charOut && (p.write || p.writeWithoutResponse)) {
            charOut = c;
            log(` -> Selected as TX (Out): ${u}`);
          }
          if (!charIn && p.notify) {
            charIn = c;
            log(` -> Selected as RX (In): ${u}`);
          }
        }

        if (!charOut) throw new Error('No writable characteristic discovered.');

        if (charIn) {
          await charIn.startNotifications();
          charIn.addEventListener('characteristicvaluechanged', (e) => {
            const b = new Uint8Array(e.target.value.buffer);
            log(`RX: [${Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ')}]`);
          });
        }

        log('SUCCESS: HT37 ready! Click "Wake / Vibrate" to test.');
        document.getElementById('btnPing').disabled = false;
        document.getElementById('btnFlash').disabled = false;
        document.getElementById('btnDisconnect').disabled = false;

      } catch (err) {
        log('Connection aborted: ' + err.message);
        cleanupConnection();
      }
    };

    // --- TEST WATCH WAKE (Cmd 0x19) ---
    document.getElementById('btnPing').onclick = async () => {
      if (!charOut) return;
      try {
        log('Transmitting Wake frame (0x19)...');
        const pkt = buildPacket(0x19, [0x01]);
        if (charOut.properties.write) {
          await charOut.writeValue(pkt);
        } else {
          await charOut.writeValueWithoutResponse(pkt);
        }
        log('Frame delivered! Screen should light up and vibrate.');
      } catch (e) {
        log('Wake failed: ' + e.message);
      }
    };

    // --- CANVAS RENDERING (360x360) ---
    const canvas = document.getElementById('watchCanvas');
    const ctx = canvas.getContext('2d');
    let userBgImage = null;

    function renderPreview() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 360, 360);

      if (userBgImage) {
        ctx.drawImage(userBgImage, 0, 0, 360, 360);
      }

      const timeStr = "10:08";
      const font = document.getElementById('timeFont').value;
      const size = document.getElementById('timeSize').value;
      const posY = parseInt(document.getElementById('timePosY').value);

      ctx.fillStyle = document.getElementById('timeColor').value;
      ctx.font = `bold ${size}px ${font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeStr, 180, posY);

      if (document.getElementById('showDate').checked) {
        ctx.fillStyle = document.getElementById('dateColor').value;
        ctx.font = '600 20px sans-serif';
        ctx.fillText("WED, OCT 24", 180, posY - (size * 0.7));
      }

      const bottomY = posY + (size * 0.7);

      if (document.getElementById('showSteps').checked) {
        ctx.fillStyle = document.getElementById('stepsColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("👟 8,432", 110, bottomY);
      }

      if (document.getElementById('showHeart').checked) {
        ctx.fillStyle = document.getElementById('heartColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("❤️ 72", 250, bottomY);
      }

      if (document.getElementById('showBattery').checked) {
        ctx.fillStyle = document.getElementById('batteryColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("🔋 85%", 180, 50);
      }
    }

    ['timeColor', 'timeSize', 'timePosY', 'timeFont', 'showDate', 'dateColor',
     'showBattery', 'batteryColor', 'showSteps', 'stepsColor', 'showHeart', 'heartColor']
    .forEach(id => document.getElementById(id).addEventListener('input', renderPreview));

    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userBgImage = img;
            renderPreview();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    renderPreview();

    // --- BINARY BUILDER (RGB565 360x360 TYPE C) ---
    function generateWatchFaceBinary() {
      const imgData = ctx.getImageData(0, 0, 360, 360).data;
      const rawBmpSize = 360 * 360 * 2;
      const headerSize = 32;
      const bin = new Uint8Array(headerSize + rawBmpSize);

      bin[0] = 0x43; // 'C'
      bin[1] = 0x81;
      bin[2] = 0xC3; // Face 50001
      bin[3] = 0x50;
      bin[4] = 360 & 0xFF; // Width
      bin[5] = (360 >> 8) & 0xFF;
      bin[6] = 360 & 0xFF; // Height
      bin[7] = (360 >> 8) & 0xFF;

      let ptr = headerSize;
      for (let i = 0; i < imgData.length; i += 4) {
        const r = imgData[i];
        const g = imgData[i + 1];
        const b = imgData[i + 2];
        const rgb565 = ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);

        bin[ptr++] = rgb565 & 0xFF;
        bin[ptr++] = (rgb565 >> 8) & 0xFF;
      }

      return bin;
    }

    // --- WATCH FACE OTA TRANSFER ---
    document.getElementById('btnFlash').onclick = async () => {
      try {
        log('Generating 360x360 Type C binary...');
        const bin = generateWatchFaceBinary();
        log(`Binary size: ${bin.byteLength} bytes.`);

        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';

        log('Initiating OTA handshake (Cmd 0xB9)...');
        const initPayload = [
          0x01,
          bin.byteLength & 0xFF,
          (bin.byteLength >> 8) & 0xFF,
          (bin.byteLength >> 16) & 0xFF,
          (bin.byteLength >> 24) & 0xFF
        ];
        
        const initPkt = buildPacket(0xB9, initPayload);
        if (charOut.properties.write) {
          await charOut.writeValue(initPkt);
        } else {
          await charOut.writeValueWithoutResponse(initPkt);
        }

        await sleep(500);

        const CHUNK_SIZE = 20;
        let offset = 0;

        while (offset < bin.byteLength) {
          const chunk = bin.subarray(offset, Math.min(offset + CHUNK_SIZE, bin.byteLength));
          if (charOut.properties.writeWithoutResponse) {
            await charOut.writeValueWithoutResponse(chunk);
          } else {
            await charOut.writeValue(chunk);
          }
          offset += chunk.length;

          if (offset % 2000 === 0 || offset === bin.byteLength) {
            const percent = ((offset / bin.byteLength) * 100).toFixed(1);
            progressBar.style.width = percent + '%';
            log(`Streaming: ${percent}% (${offset}/${bin.byteLength})`);
            await sleep(12);
          }
        }

        log('Flash complete! Watch should refresh to your new dial.');
      } catch (err) {
        log('Flash error: ' + err.message);
      }
    };
  </script>
</body>
</html>
