<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Studio & Sensor Probe [Build 16.0]</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 1.4rem; color: var(--accent); }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* Probe & Monitor Panel */
    .probe-container {
      width: 100%;
      max-width: 1050px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .probe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .probe-card {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }
    .probe-card span { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; display: block; }
    .probe-card strong { font-size: 1.1rem; color: #f8fafc; margin-top: 2px; display: inline-block; }
    
    .workspace {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1050px;
    }
    .watch-bezel {
      width: 360px;
      height: 360px;
      background: #020617;
      border: 8px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #watchCanvas { width: 344px; height: 344px; border-radius: 50%; background: #000; }

    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: #94a3b8; }
    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.btn-primary { background: #0284c7; font-weight: 600; cursor: pointer; }
    button.btn-danger { background: #991b1b; cursor: pointer; }
    button.btn-success { background: #059669; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .progress-bar-container {
      width: 100%;
      background: #090d16;
      border-radius: 6px;
      overflow: hidden;
      height: 16px;
      display: none;
      border: 1px solid var(--border);
      position: relative;
    }
    .progress-bar { width: 0%; height: 100%; background: #10b981; transition: width 0.1s linear; }
    .progress-text {
      position: absolute; width: 100%; text-align: center;
      line-height: 16px; font-size: 10px; font-weight: bold; color: #fff;
    }

    #logBox {
      background: #020617;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.72rem;
      padding: 10px;
      border-radius: 8px;
      height: 180px;
      overflow-y: auto;
      margin-top: 15px;
      width: 100%;
      max-width: 1050px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>HT37 Studio & Sensor Probe</h1>
    <div class="badge">BUILD 16.0 - DYNAMIC PAYLOAD & LIVE TELEMETRY</div>
  </header>

  <!-- LIVE SENSOR & DATA PROBE MONITOR -->
  <div class="probe-container">
    <span class="section-title">Live Sensor & Telemetry Probe Window</span>
    <div class="probe-grid">
      <div class="probe-card">
        <span>Device Connection</span>
        <strong id="valStatus" style="color:var(--danger)">Disconnected</strong>
      </div>
      <div class="probe-card">
        <span>Hardware Battery</span>
        <strong id="valBattery">--</strong>
      </div>
      <div class="probe-card">
        <span>Last Watch Event</span>
        <strong id="valEvent" style="font-size:0.85rem; color:var(--accent)">Idle</strong>
      </div>
      <div class="probe-card">
        <span>Packets Streamed</span>
        <strong id="valPackets">0 RX / 0 TX</strong>
      </div>
    </div>
  </div>

  <div class="workspace">
    <div class="preview-section">
      <div class="watch-bezel">
        <canvas id="watchCanvas" width="360" height="360"></canvas>
      </div>

      <div class="editor-panel" style="margin-top: 15px;">
        <span class="section-title">OTA Flashing Engine</span>
        <div class="inline-fields">
          <button id="btnConnect" class="btn-primary">1. Connect HT37</button>
          <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
        </div>

        <div class="form-group">
          <label>Watch Face .BIN File:</label>
          <input type="file" id="binTemplateInput" accept=".bin">
        </div>

        <button id="btnFlash" class="btn-success" disabled>2. Flash .BIN to Watch</button>
        
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
          <div class="progress-text" id="progressText">0%</div>
        </div>
      </div>
    </div>

    <div class="editor-panel">
      <span class="section-title">Custom Watch Face Preview</span>
      <div class="form-group">
        <label>Custom Artwork</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label>Clock Color</label>
          <input type="color" id="timeColor" value="#ffffff">
        </div>
        <div class="form-group">
          <label>Clock Size</label>
          <input type="number" id="timeSize" value="64" min="20" max="120">
        </div>
      </div>
      <button id="btnExportBin" class="btn-secondary">Export Compiled .BIN</button>
    </div>
  </div>

  <div id="logBox">Build 16.0 Ready. Connect HT37.</div>

  <script>
    const SERVICE_VENDOR_9966 = '00009966-3c17-d293-8e48-14fe2e4da212';
    const CHAR_VENDOR_TX     = '0000ffb1-0000-1000-8000-00805f9b34fb';
    const CHAR_VENDOR_RX     = '0000ffb2-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let gattServer = null;
    let charVendorTx = null;
    let charVendorRx = null;
    let loadedBinData = null;
    let isFlashing = false;
    let rxCount = 0;
    let txCount = 0;
    let watchNackReceived = false;

    const logBox = document.getElementById('logBox');
    function log(msg) {
      const ts = new Date().toLocaleTimeString();
      logBox.innerText += `\n[${ts}] ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
      console.log(msg);
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function updateProbe(eventText) {
      document.getElementById('valPackets').textContent = `${rxCount} RX / ${txCount} TX`;
      if (eventText) document.getElementById('valEvent').textContent = eventText;
    }

    // --- 1. CONNECT & SENSOR INSPECTION ---
    document.getElementById('btnConnect').onclick = async () => {
      try {
        log('Connecting to HT37...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'HT37' }, { namePrefix: 'HT37' }],
          optionalServices: [
            SERVICE_VENDOR_9966,
            '0000180f-0000-1000-8000-00805f9b34fb', // Battery
            '0000180a-0000-1000-8000-00805f9b34fb'
          ]
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          log('Notice: HT37 disconnected.');
          document.getElementById('valStatus').textContent = 'Disconnected';
          document.getElementById('valStatus').style.color = 'var(--danger)';
          document.getElementById('btnDisconnect').disabled = true;
          document.getElementById('btnFlash').disabled = true;
        });

        gattServer = await bleDevice.gatt.connect();
        document.getElementById('valStatus').textContent = 'Connected';
        document.getElementById('valStatus').style.color = 'var(--success)';
        document.getElementById('btnDisconnect').disabled = false;

        // Query Battery
        try {
          const batService = await gattServer.getPrimaryService('0000180f-0000-1000-8000-00805f9b34fb');
          const batChar = await batService.getCharacteristic('00002a19-0000-1000-8000-00805f9b34fb');
          const batVal = await batChar.readValue();
          document.getElementById('valBattery').textContent = `${batVal.getUint8(0)}%`;
        } catch (e) {
          document.getElementById('valBattery').textContent = 'Stream Active';
        }

        // Map Vendor Services
        const vService = await gattServer.getPrimaryService(SERVICE_VENDOR_9966);
        charVendorTx = await vService.getCharacteristic(CHAR_VENDOR_TX);
        charVendorRx = await vService.getCharacteristic(CHAR_VENDOR_RX);

        await charVendorRx.startNotifications();
        charVendorRx.addEventListener('characteristicvaluechanged', (e) => {
          rxCount++;
          const b = new Uint8Array(e.target.value.buffer);
          const hex = Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ');

          // Live interpretation in Probe Window
          let desc = `Packet 0x${b[0].toString(16).toUpperCase()}`;
          if (b[0] === 0x81 && b.length === 32) desc = 'OTA Mode Confirmed (Ready)';
          if (b[0] === 0xd4 || b[0] === 0xe4) desc = 'Handshake Synced';
          if (b[0] === 0xb0) desc = 'Checkpoint ACK';
          if (b[0] === 0x80) {
            desc = 'Watch NACK / Wait';
            watchNackReceived = true;
          }

          updateProbe(desc);
          if (b[0] !== 0x80) log(`<< RX [${b.length}B]: ${hex} (${desc})`);
        });

        log('SUCCESS: HT37 connected and probe monitor online!');
        if (loadedBinData) document.getElementById('btnFlash').disabled = false;

      } catch (err) {
        log('Connection error: ' + err.message);
      }
    };

    document.getElementById('btnDisconnect').onclick = () => {
      if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
    };

    // --- TEMPLATE PICKER ---
    document.getElementById('binTemplateInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          loadedBinData = new Uint8Array(evt.target.result);
          log(`Selected .bin: ${file.name} (${loadedBinData.byteLength} bytes).`);
          if (gattServer && gattServer.connected) {
            document.getElementById('btnFlash').disabled = false;
          }
        };
        reader.readAsArrayBuffer(file);
      }
    });

    // --- 2. DYNAMIC FLASH ENGINE WITH FLOW CONTROL ---
    document.getElementById('btnFlash').onclick = async () => {
      if (!charVendorTx || !loadedBinData) return;
      if (isFlashing) return;
      isFlashing = true;
      watchNackReceived = false;
      document.getElementById('btnFlash').disabled = true;

      try {
        const fileSize = loadedBinData.byteLength;
        log(`--- STARTING TRANSMISSION: ${fileSize} BYTES ---`);

        // Encode EXACT file size dynamically into bytes 8..11 (Little-Endian)
        const initPkt = new Uint8Array([
          0x01, 0, 0, 0, 0, 0, 0, 0,
          (fileSize & 0xFF),
          ((fileSize >> 8) & 0xFF),
          ((fileSize >> 16) & 0xFF),
          ((fileSize >> 24) & 0xFF),
          0x04
        ]);

        log(`Step 1: Sending Dynamic Wake for ${fileSize} bytes...`);
        if (charVendorTx.properties.write) {
          await charVendorTx.writeValue(initPkt);
        } else {
          await charVendorTx.writeValueWithoutResponse(initPkt);
        }
        txCount++;
        updateProbe('OTA Trigger Sent');

        // Allow watch bootloader to allocate exact flash memory
        await sleep(1000);

        log(`Step 2: Paced binary streaming to FFB1...`);
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        progressContainer.style.display = 'block';

        const CHUNK_SIZE = 20;
        let offset = 0;

        while (offset < fileSize) {
          if (!bleDevice.gatt.connected) throw new Error('Watch disconnected during stream.');

          // Flow control: If watch requests pause, back off briefly
          if (watchNackReceived) {
            await sleep(50);
            watchNackReceived = false;
          }

          const chunk = loadedBinData.subarray(offset, Math.min(offset + CHUNK_SIZE, fileSize));
          
          if (charVendorTx.properties.writeWithoutResponse) {
            await charVendorTx.writeValueWithoutResponse(chunk);
          } else {
            await charVendorTx.writeValue(chunk);
          }
          offset += chunk.length;
          txCount++;

          // 25ms flash write cycle pacing
          await sleep(25);

          if (offset % 4000 === 0 || offset === fileSize) {
            const pct = Math.round((offset / fileSize) * 100);
            progressBar.style.width = pct + '%';
            progressText.textContent = pct + '%';
            updateProbe(`Streaming: ${pct}%`);
            log(`Stream: ${pct}% (${offset}/${fileSize} bytes)`);
          }
        }

        log('All bytes transmitted! Watch is finalizing watch face.');
        updateProbe('Upload Complete - Verifying');

      } catch (e) {
        log('Flash error: ' + e.message);
        updateProbe('Transfer Error');
      } finally {
        isFlashing = false;
        document.getElementById('btnFlash').disabled = false;
      }
    };

    // Canvas Preview
    const canvas = document.getElementById('watchCanvas');
    const ctx = canvas.getContext('2d');
    function renderPreview() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 360, 360);
      ctx.fillStyle = document.getElementById('timeColor').value;
      ctx.font = `bold ${document.getElementById('timeSize').value}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("10:08", 180, 160);
    }
    document.getElementById('timeColor').addEventListener('input', renderPreview);
    document.getElementById('timeSize').addEventListener('input', renderPreview);
    renderPreview();
  </script>
</body>
</html>
