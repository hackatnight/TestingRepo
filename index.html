<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HT37 (360x360) Watch Face Studio</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-bg: #151d30;
            --panel-border: #263352;
            --accent: #0ea5e9;
            --success: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .workspace {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 28px;
            max-width: 1180px;
            width: 100%;
        }
        @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; font-size: 1.15rem; }
        /* HT37 360x360 Circular Bezel */
        .watch-bezel {
            width: 320px;
            height: 320px;
            background: #000;
            margin: 0 auto 16px;
            border-radius: 50%;
            border: 10px solid #2d3748;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
        }
        canvas#dialCanvas { width: 100%; height: 100%; display: block; border-radius: 50%; }
        .field-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: #0d1527;
            color: var(--text-main);
            box-sizing: border-box;
        }
        .btn-row { display: flex; gap: 10px; }
        button {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-gray { background: #334155; color: white; }
        .terminal {
            background: #050811;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            height: 240px;
            overflow-y: auto;
            color: #38bdf8;
            margin-top: 14px;
            line-height: 1.45;
        }
        .progress-bar-bg {
            background: #1e293b;
            border-radius: 6px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>
<div class="workspace">
    <div class="card">
        <h2>HT37 Watch Face (360×360 Circular)</h2>
        <div class="watch-bezel">
            <canvas id="dialCanvas" width="360" height="360"></canvas>
        </div>
        <div class="field-group">
            <label>Background Wallpaper</label>
            <input type="file" id="inputImage" accept="image/*">
        </div>
        <div class="field-group">
            <label>Clock Color</label>
            <input type="color" id="inputColor" value="#ffffff">
        </div>
        <div class="field-group">
            <label>Time Position (Y-Axis)</label>
            <input type="range" id="inputTimeY" min="80" max="260" value="150">
        </div>
        <button class="btn-gray" id="btnDownload" style="width: 100%; margin-top: 10px;">Download 360x360 .bin</button>
    </div>

    <div class="card">
        <h2>Direct BLE Flash (DaFit/MoYoung Mode)</h2>
        <p style="font-size:0.85rem; color:var(--text-muted);">
            Packaged as native 360×360 circular RGB565 to prevent the watch bootloader from reverting.
        </p>
        <div class="btn-row" style="margin-bottom: 10px;">
            <button class="btn-blue" id="btnBleConnect" style="flex: 1;">1. Connect Watch</button>
            <button class="btn-green" id="btnBlePush" style="flex: 1;" disabled>2. Flash to Watch</button>
        </div>
        <div class="progress-bar-bg" id="progBarContainer">
            <div class="progress-bar-fill" id="progBar"></div>
        </div>
        <div class="terminal" id="termLog"></div>
    </div>
</div>
<script>
    const WIDTH = 360, HEIGHT = 360; // Exact HT37 screen resolution
    const canvas = document.getElementById('dialCanvas'), ctx = canvas.getContext('2d');
    let loadedImage = null, textColor = "#ffffff", timeY = 150;

    function log(m) {
        const term = document.getElementById('termLog');
        term.innerHTML += '<div>[' + new Date().toTimeString().split(' ')[0] + '] ' + m + '</div>';
        term.scrollTop = term.scrollHeight;
    }

    function createDefaultWallpaper() {
        const off = document.createElement('canvas'); off.width = WIDTH; off.height = HEIGHT;
        const octx = off.getContext('2d');
        const g = octx.createRadialGradient(WIDTH/2, HEIGHT/2, 20, WIDTH/2, HEIGHT/2, WIDTH/2);
        g.addColorStop(0, "#1e3a8a"); g.addColorStop(0.7, "#0f172a"); g.addColorStop(1, "#020617");
        octx.fillStyle = g; octx.fillRect(0, 0, WIDTH, HEIGHT);
        const img = new Image(); img.onload = () => { loadedImage = img; render(); };
        img.src = off.toDataURL();
    }

    function render() {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
        if (loadedImage) ctx.drawImage(loadedImage, 0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = textColor;
        ctx.font = "bold 56px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("10:08", WIDTH / 2, timeY);

        ctx.font = "600 16px system-ui, sans-serif";
        ctx.fillText("THU, OCT 22", WIDTH / 2, timeY + 44);
        ctx.font = "500 15px system-ui, sans-serif";
        ctx.fillText("👟 7,842 steps", WIDTH / 2, timeY + 70);
    }

    document.getElementById('inputImage').onchange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const r = new FileReader(); r.onload = (ev) => { const img = new Image(); img.onload = () => { loadedImage = img; render(); }; img.src = ev.target.result; };
        r.readAsDataURL(file);
    };
    document.getElementById('inputColor').oninput = (e) => { textColor = e.target.value; render(); };
    document.getElementById('inputTimeY').oninput = (e) => { timeY = parseInt(e.target.value); render(); };

    // Pack watch face with exact 360x360 DaFit / MoYoung Type C Header
    function packDialBinary() {
        const d = ctx.getImageData(0, 0, WIDTH, HEIGHT).data;
        const rgb565 = new Uint8Array(WIDTH * HEIGHT * 2);
        for (let i = 0; i < WIDTH * HEIGHT; i++) {
            const val = (((d[i * 4] >> 3) & 0x1F) << 11) | (((d[i * 4 + 1] >> 2) & 0x3F) << 5) | ((d[i * 4 + 2] >> 3) & 0x1F);
            rgb565[i * 2] = val & 0xFF; rgb565[i * 2 + 1] = (val >> 8) & 0xFF;
        }

        // MoYoung / DaFit Watch Face Header (64 bytes)
        const header = new Uint8Array(64);
        const v = new DataView(header.buffer);
        header[0] = 0x43; // FileType 'C'
        header[1] = 0x81; // FileID
        v.setUint16(2, 50001, true);          // Face Number
        v.setUint16(4, WIDTH, true);           // Width: 360
        v.setUint16(6, HEIGHT, true);          // Height: 360
        v.setUint32(8, 64, true);              // Offset to background bitmap
        v.setUint32(12, rgb565.length, true);  // Background size in bytes
        v.setUint16(16, WIDTH / 2, true);      // Time Center X
        v.setUint16(18, timeY, true);          // Time Center Y

        const hex = textColor.replace('#', '');
        v.setUint16(20, (((parseInt(hex.substr(0, 2), 16) >> 3) & 0x1F) << 11) | (((parseInt(hex.substr(2, 2), 16) >> 2) & 0x3F) << 5) | ((parseInt(hex.substr(4, 2), 16) >> 3) & 0x1F), true);

        const out = new Uint8Array(header.length + rgb565.length);
        out.set(header, 0); out.set(rgb565, header.length);
        return out;
    }

    document.getElementById('btnDownload').onclick = () => {
        const b = new Blob([packDialBinary()], { type: "application/octet-stream" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = "ht37_360x360.bin"; a.click();
        log("Saved ht37_360x360.bin. You can upload this directly on dafit-canvas.elabins.com/upload!");
    };

    let rxChar = null;
    let txChar = null;

    const TARGET_SERVICE = '00009966-3c17-d293-8e48-14fe2e4da212';
    const CHAR_WRITE     = '0000ffb1-0000-1000-8000-00805f9b34fb';
    const CHAR_NOTIFY    = '0000ffb2-0000-1000-8000-00805f9b34fb';

    document.getElementById('btnBleConnect').onclick = async () => {
        try {
            log("Prompting Bluetooth pairing dialog...");
            const dev = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "HT37" }, { namePrefix: "Watch" }],
                optionalServices: [TARGET_SERVICE, 0xFEEA]
            });

            log("Connecting GATT to " + (dev.name || "HT37") + "...");
            const srv = await dev.gatt.connect();
            const service = await srv.getPrimaryService(TARGET_SERVICE);

            rxChar = await service.getCharacteristic(CHAR_WRITE);
            txChar = await service.getCharacteristic(CHAR_NOTIFY);

            await txChar.startNotifications();
            txChar.addEventListener('characteristicvaluechanged', (e) => {
                const b = new Uint8Array(e.target.value.buffer);
                const h = Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ');
                log("<b style='color:#a7f3d0;'><= Watch ACK:</b> " + h);
            });

            document.getElementById('btnBlePush').disabled = false;
            log("<b style='color:#10b981;'>Connected to HT37. Ready to flash 360x360 dial.</b>");
        } catch (e) {
            log("<b style='color:#ef4444;'>BLE Error: " + e.message + "</b>");
        }
    };

    document.getElementById('btnBlePush').onclick = async () => {
        if (!rxChar) return;

        const bin = packDialBinary();
        const pbg = document.getElementById('progBarContainer'), pf = document.getElementById('progBar');
        pbg.style.display = 'block'; pf.style.width = '0%';

        log("1. Sending 360x360 Dial Start Command...");
        
        // DaFit OTA Start Packet for Watch Face (ID: 0x81)
        const initPkt = new Uint8Array([0xED, 0x02, 0x01, 0x81, 0, 0, 0, 0]);
        new DataView(initPkt.buffer).setUint32(4, bin.length, false);

        try {
            await rxChar.writeValue(initPkt);
            log("Watch accepted start packet. Progress bar should now appear on watch...");
            await new Promise(r => setTimeout(r, 600));

            const chunkSize = 240;
            const total = Math.ceil(bin.length / chunkSize);
            log("2. Streaming " + bin.length + " bytes (" + total + " packets)...");

            for (let i = 0; i < total; i++) {
                const chunk = bin.slice(i * chunkSize, (i + 1) * chunkSize);
                await rxChar.writeValueWithoutResponse(chunk);
                pf.style.width = Math.round(((i + 1) / total) * 100) + '%';
                await new Promise(r => setTimeout(r, 18));
            }

            log("3. Sending validation and apply command...");
            const endPkt = new Uint8Array([0xED, 0x02, 0x02, 0x81]);
            await rxChar.writeValue(endPkt);

            log("<b style='color:#10b981;'>Flash complete! The watch will apply the 360x360 face now.</b>");
        } catch (e) {
            log("<b style='color:#ef4444;'>Push Error: " + e.message + "</b>");
        }
    };

    createDefaultWallpaper();
    log("HT37 Studio Ready (360x360 Engine).");
</script>
</body>
</html>
