<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HT37 Studio (FitCloudPro Edition)</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .workspace {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }
    .watch-bezel {
      width: 380px;
      height: 380px;
      background: #020617;
      border: 8px solid #334155;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8);
    }
    #watchCanvas {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #000;
    }
    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: #94a3b8; }
    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    input[type="color"] { height: 38px; padding: 2px; cursor: pointer; }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.btn-primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; cursor: pointer; }
    button.btn-primary:hover { background: #0369a1; }
    button.btn-secondary { background: #1e293b; cursor: pointer; }
    button.btn-danger { background: #991b1b; border-color: var(--danger); cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    #logBox {
      background: #020617;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.72rem;
      padding: 12px;
      border-radius: 8px;
      height: 160px;
      overflow-y: auto;
      margin-top: 15px;
      width: 100%;
      max-width: 785px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>HT37 Watch Face Studio</h1>
    <div class="badge">FITCLOUDPRO / REALTEK EDITION</div>
  </header>

  <div class="workspace">
    <div class="preview-section">
      <div class="watch-bezel">
        <canvas id="watchCanvas" width="360" height="360"></canvas>
      </div>

      <div class="editor-panel" style="margin-top: 15px;">
        <span class="section-title">FitCloudPro Link</span>
        <div class="inline-fields">
          <button id="btnConnect" class="btn-primary">1. Pair HT37</button>
          <button id="btnDisconnect" class="btn-danger" disabled>Disconnect</button>
        </div>
        <button id="btnPing" class="btn-secondary" disabled>2. Wake / Find Watch</button>
      </div>
    </div>

    <div class="editor-panel">
      <span class="section-title">Wallpaper</span>
      <div class="form-group">
        <label>Upload Image (360x360)</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>

      <span class="section-title">Clock Customizer</span>
      <div class="inline-fields">
        <div class="form-group">
          <label>Color</label>
          <input type="color" id="timeColor" value="#ffffff">
        </div>
        <div class="form-group">
          <label>Size (px)</label>
          <input type="number" id="timeSize" value="64" min="20" max="120">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label>Position (Y)</label>
          <input type="range" id="timePosY" min="60" max="300" value="160">
        </div>
        <div class="form-group">
          <label>Font</label>
          <select id="timeFont">
            <option value="sans-serif">Modern Sans</option>
            <option value="monospace">Digital Monospace</option>
            <option value="Impact">Bold Impact</option>
          </select>
        </div>
      </div>

      <span class="section-title">Widgets</span>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showDate" checked> Date</label>
          <input type="color" id="dateColor" value="#38bdf8">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showBattery" checked> Battery</label>
          <input type="color" id="batteryColor" value="#4ade80">
        </div>
      </div>
      <div class="inline-fields">
        <div class="form-group">
          <label><input type="checkbox" id="showSteps" checked> Steps</label>
          <input type="color" id="stepsColor" value="#facc15">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="showHeart" checked> Heart Rate</label>
          <input type="color" id="heartColor" value="#f87171">
        </div>
      </div>
    </div>
  </div>

  <div id="logBox">Status: Pair watch with FitCloudPro on phone first, turn off phone Bluetooth, then click "1. Pair HT37".</div>

  <script>
    // FitCloudPro / Realtek Standard GATT UUIDs
    const FITCLOUD_SERVICES = [
      '000056ff-0000-1000-8000-00805f9b34fb', // FitCloud proprietary service
      '0000fee7-0000-1000-8000-00805f9b34fb', // Tencent / Topstep service
      '0000fff0-0000-1000-8000-00805f9b34fb', // Realtek UART profile
      '0000d0ff-3c17-d293-8e48-14fe2e4da212', // Realtek OTA DFU
      '00001800-0000-1000-8000-00805f9b34fb',
      '0000180a-0000-1000-8000-00805f9b34fb'
    ];

    let bleDevice = null;
    let charWrite = null;
    let charNotify = null;

    const logBox = document.getElementById('logBox');
    function log(msg) {
      console.log(msg);
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function cleanupConnection() {
      if (bleDevice && bleDevice.gatt.connected) {
        log('Closing connection...');
        bleDevice.gatt.disconnect();
      }
      charWrite = null;
      charNotify = null;
      document.getElementById('btnPing').disabled = true;
      document.getElementById('btnDisconnect').disabled = true;
    }

    document.getElementById('btnDisconnect').onclick = cleanupConnection;

    // --- FITCLOUDPRO AUTO-CONNECT ---
    document.getElementById('btnConnect').onclick = async () => {
      try {
        cleanupConnection();

        log('Scanning for HT37 (FitCloudPro profile)...');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { name: 'HT37' },
            { namePrefix: 'HT37' }
          ],
          optionalServices: FITCLOUD_SERVICES
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          log('Notice: Watch disconnected.');
          cleanupConnection();
        });

        log(`Connecting to ${bleDevice.name}...`);
        const server = await bleDevice.gatt.connect();

        log('Connected! Waiting 1s for Windows GATT database enumeration...');
        await sleep(1000);

        let activeService = null;
        for (const uuid of FITCLOUD_SERVICES) {
          try {
            activeService = await server.getPrimaryService(uuid);
            if (activeService) {
              log(`Discovered Service: ${uuid}`);
              break;
            }
          } catch (e) {}
        }

        if (!activeService) {
          throw new Error('No FitCloudPro service found. Make sure the watch is activated past the QR screen.');
        }

        const characteristics = await activeService.getCharacteristics();
        for (const c of characteristics) {
          const props = c.properties;
          log(`Characteristic: ${c.uuid} [write:${props.write || props.writeWithoutResponse}, notify:${props.notify}]`);

          if (!charWrite && (props.write || props.writeWithoutResponse)) {
            charWrite = c;
            log(` -> Configured TX: ${c.uuid}`);
          }
          if (!charNotify && props.notify) {
            charNotify = c;
            log(` -> Configured RX: ${c.uuid}`);
          }
        }

        if (charNotify) {
          await charNotify.startNotifications();
          charNotify.addEventListener('characteristicvaluechanged', (e) => {
            const b = new Uint8Array(e.target.value.buffer);
            log(`RX: [${Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' ')}]`);
          });
        }

        log('SUCCESS: FitCloudPro connection active!');
        document.getElementById('btnPing').disabled = false;
        document.getElementById('btnDisconnect').disabled = false;

      } catch (err) {
        log('Connection failed: ' + err.message);
        cleanupConnection();
      }
    };

    // --- WAKE / FIND WATCH (FitCloudPro Command Packet) ---
    document.getElementById('btnPing').onclick = async () => {
      if (!charWrite) return;
      try {
        log('Sending FitCloudPro Find Watch packet...');
        // FitCloudPro standard packet envelope: [0x02, 0x03, 0x01, ...]
        const pkt = new Uint8Array([0x02, 0x03, 0x01, 0x00]);
        if (charWrite.properties.write) {
          await charWrite.writeValue(pkt);
        } else {
          await charWrite.writeValueWithoutResponse(pkt);
        }
        log('Delivered! Watch screen should activate and vibrate.');
      } catch (err) {
        log('Wake failed: ' + err.message);
      }
    };

    // --- CANVAS ENGINE (360x360) ---
    const canvas = document.getElementById('watchCanvas');
    const ctx = canvas.getContext('2d');
    let userBgImage = null;

    function renderPreview() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 360, 360);

      if (userBgImage) {
        ctx.drawImage(userBgImage, 0, 0, 360, 360);
      }

      const timeStr = "10:08";
      const font = document.getElementById('timeFont').value;
      const size = document.getElementById('timeSize').value;
      const posY = parseInt(document.getElementById('timePosY').value);

      ctx.fillStyle = document.getElementById('timeColor').value;
      ctx.font = `bold ${size}px ${font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeStr, 180, posY);

      if (document.getElementById('showDate').checked) {
        ctx.fillStyle = document.getElementById('dateColor').value;
        ctx.font = '600 20px sans-serif';
        ctx.fillText("WED, OCT 24", 180, posY - (size * 0.7));
      }

      const bottomY = posY + (size * 0.7);

      if (document.getElementById('showSteps').checked) {
        ctx.fillStyle = document.getElementById('stepsColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("👟 8,432", 110, bottomY);
      }

      if (document.getElementById('showHeart').checked) {
        ctx.fillStyle = document.getElementById('heartColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("❤️ 72", 250, bottomY);
      }

      if (document.getElementById('showBattery').checked) {
        ctx.fillStyle = document.getElementById('batteryColor').value;
        ctx.font = '500 16px sans-serif';
        ctx.fillText("🔋 85%", 180, 50);
      }
    }

    ['timeColor', 'timeSize', 'timePosY', 'timeFont', 'showDate', 'dateColor',
     'showBattery', 'batteryColor', 'showSteps', 'stepsColor', 'showHeart', 'heartColor']
    .forEach(id => document.getElementById(id).addEventListener('input', renderPreview));

    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userBgImage = img;
            renderPreview();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    renderPreview();
  </script>
</body>
</html>
